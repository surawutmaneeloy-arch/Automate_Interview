name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  robot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: rfbrowser init chromium
      # Failing tests are expected: they are the defects found in Builds 1-9 and on the public sites.
      - run: robotcode robot
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test_Result
          path: Test_Result
